<div class="relative">
  <button
    (click)="toggleMenu()"
    class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors text-sm font-medium flex items-center gap-2">
    <span>📷</span>
    <span>{{ 'profileImage.manage' | translate }}</span>
  </button>

  @if(showMenu()) {
    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 z-50">
      <div class="p-2">
        <label class="block w-full px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded cursor-pointer transition-colors">
          <span>{{ 'profileImage.upload' | translate }}</span>
          <input
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="hidden">
        </label>
        
        <button
          (click)="deleteImage()"
          [disabled]="isUploading()"
          class="block w-full text-left px-3 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded transition-colors disabled:opacity-50">
          {{ 'profileImage.delete' | translate }}
        </button>
      </div>
    </div>
  }

  @if(isUploading()) {
    <div class="absolute right-0 mt-2 p-3 bg-blue-50 dark:bg-gray-800 rounded-lg shadow-lg border border-blue-200 dark:border-gray-700">
      <p class="text-sm text-blue-600 dark:text-blue-400">{{ 'profileImage.uploading' | translate }}</p>
    </div>
  }

  @if(errorMessage()) {
    <div class="absolute right-0 mt-2 p-3 bg-red-50 dark:bg-red-900/20 rounded-lg shadow-lg border border-red-200 dark:border-red-800">
      <p class="text-sm text-red-600 dark:text-red-400">{{ errorMessage() }}</p>
    </div>
  }
</div>
