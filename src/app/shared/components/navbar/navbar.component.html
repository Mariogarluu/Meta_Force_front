<header class="navbar">
  <div class="navbar__inner relative">
    <a routerLink="/" class="navbar__brand" aria-label="Meta Force Inicio">
      <img src="/Logo.png" alt="Meta Force" class="navbar__logo" />
    </a>

    <nav class="navbar__menu">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          class="navbar__link">
          {{ (link.key | translate) || link.label }}
        </a>
      }
    </nav>

    <div class="navbar__actions flex items-center gap-3">
      <div class="flex items-center gap-2">
        <app-language-selector></app-language-selector>
        <app-theme-toggle></app-theme-toggle>
      </div>

      @if (!auth.currentUser()) {
        <a routerLink="/login" class="navbar__login">{{ ('nav.login' | translate) || 'Iniciar sesión' }}</a>
      } @else {
        <a routerLink="/dashboard" class="navbar__icon-btn" aria-label="Perfil">
          <span>👤</span>
        </a>
      }
    </div>
  </div>
</header>
